<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <!-- Updated -->
  <meta name="mobile-web-app-capable" content="yes"> <!-- Added -->
  <meta name="apple-mobile-web-app-capable" content="yes"> <!-- Added -->
  <title>Phonics Speed Challenge</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="container d-flex flex-column justify-content-center min-vh-100">
    <div class="d-flex justify-content-center mb-4">
      <img src="LogoLetterhead.png" class="img-fluid" alt="Oddbeaker Logo" style="max-width: 80%;" /><br />&nbsp;
    </div>
    <!-- PWA Install Banner -->
    <div id="install-banner" class="alert alert-info mx-auto mb-4" style="display: none; max-width: 500px;">
      <div class="d-flex align-items-center justify-content-between">
        <div>
          <strong>📱 Install App</strong>
          <br>
          <small>Add to your home screen for quick access!</small>
        </div>
        <div>
          <button id="install-btn" class="btn btn-primary btn-sm me-2">Install</button>
          <button id="dismiss-install" class="btn btn-outline-secondary btn-sm">×</button>
        </div>
      </div>
    </div>
    <div id="game-container" class="text-center">
      <h1 class="mb-4">Phonics Speed Challenge</h1>
      <p class="mb-3">Wrong Answers: <span id="wrong-count">0</span></p>
      <p class="mb-3">
        Current Streak: <span id="current-streak">0</span> | Best Streak:
        <span id="best-streak">0</span>
      </p>
      <div id="progress-bar" class="progress mx-auto mb-4" style="width: 200px; height: 20px">
        <div id="progress-fill" class="progress-bar bg-success" role="progressbar" style="width: 100%"></div>
      </div>
      <div class="row g-3 options-row">
        <div class="col-2"></div>
        <div class="col-3">
          <div class="option" id="option1"></div>
        </div>
        <div class="col-2"></div>
        <div class="col-3">
          <div class="option" id="option2"></div>
        </div>
        <div class="col-2"></div>
      </div>
      <div class="row-spacer"></div>
      <div class="row g-3 options-row">
        <div class="col-2"></div>
        <div class="col-3">
          <div class="option" id="option3"></div>
        </div>
        <div class="col-2"></div>
        <div class="col-3">
          <div class="option" id="option4"></div>
        </div>
        <div class="col-2"></div>
      </div>
      <div class="row-spacer"></div>
      <button id="start-btn" class="btn btn-primary btn-lg d-block mx-auto">
        Start Game
      </button>
    </div>
    <div id="game-over"
      class="position-fixed top-50 start-50 translate-middle bg-white p-4 border border-2 border-dark text-center"
      style="display: none">
      <h2>Game Over</h2>
      <p id="wrong-count-display"></p>
      <p id="best-streak-display"></p>
      <p id="total-time-display"></p>
      <button id="play-again" class="btn btn-primary">Play Again</button>
    </div>
    <div class="fireworks" style="
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          pointer-events: none;
        "></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/fireworks-js@2.x/dist/index.umd.js"></script>
  <script src="script.js"></script>
</body>

</html>
